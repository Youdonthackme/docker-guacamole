name: Deploy Tailscale Guacamole RDP

on:
  push:
    branches:
      - main  # Triggers the deployment when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}         # Your server's IP address
          username: ${{ secrets.SERVER_USER }}     # Your SSH username (e.g., ubuntu)
          key: ${{ secrets.SERVER_SSH_KEY }}       # Your private SSH Key
          script: |
            cd /path/to/your/docker-compose-folder
            git pull origin main
            docker compose up -d --remove-orphans
            
